<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1e1e2f;
    font-family: Arial, sans-serif;
    color: #f0f0f0;
  }
  h1 {
    margin-bottom: 10px;
  }
  #score {
    margin-bottom: 10px;
    font-size: 18px;
  }
  canvas {
    background: #111122;
    border: 4px solid #4caf50;
    border-radius: 8px;
  }
  #overlay {
    position: absolute;
    text-align: center;
    color: white;
    font-size: 22px;
    display: none;
  }
  #restartBtn {
    margin-top: 12px;
    padding: 8px 16px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #4caf50;
    color: white;
    cursor: pointer;
  }
  #restartBtn:hover {
    background: #3e9142;
  }
  .controls {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
  #backBtn {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #333349;
    color: #f0f0f0;
    cursor: pointer;
    text-decoration: none;
  }
  #backBtn:hover {
    background: #45455f;
  }
</style>
</head>
<body>

<a id="backBtn" href="https://chonni777.github.io/eufrasiojuegos/">← Volver a la web</a>

<h1>🐍 Snake</h1>
<div id="score">Puntuación: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">Usa las flechas del teclado para moverte</div>
<div id="overlay">
  <p id="gameOverText">¡Game over!</p>
  <button id="restartBtn">Volver a jugar</button>
  <div style="margin-top: 10px;">
    <a href="https://chonni777.github.io/eufrasiojuegos/" style="color: #81c784; font-size: 14px;">← Volver a la web</a>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const restartBtn = document.getElementById('restartBtn');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, direction, nextDirection, food, score, gameLoop, gameRunning;

function init() {
  snake = [{ x: 10, y: 10 }];
  direction = { x: 0, y: 0 };
  nextDirection = { x: 0, y: 0 };
  score = 0;
  scoreEl.textContent = 'Puntuación: 0';
  placeFood();
  gameRunning = true;
  overlay.style.display = 'none';
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, 100);
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  // evitar que la comida caiga encima de la serpiente
  for (const segment of snake) {
    if (segment.x === food.x && segment.y === food.y) {
      placeFood();
      return;
    }
  }
}

function tick() {
  if (!gameRunning) return;

  direction = nextDirection;
  if (direction.x === 0 && direction.y === 0) {
    draw();
    return;
  }

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // colisión con paredes
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    return endGame();
  }

  // colisión consigo misma
  for (const segment of snake) {
    if (segment.x === head.x && segment.y === head.y) {
      return endGame();
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Puntuación: ' + score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#111122';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // comida
  ctx.fillStyle = '#ff5252';
  ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

  // serpiente
  snake.forEach((segment, i) => {
    ctx.fillStyle = i === 0 ? '#81c784' : '#4caf50';
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
}

function endGame() {
  gameRunning = false;
  clearInterval(gameLoop);
  document.getElementById('gameOverText').textContent =
    '¡Game over! Puntuación final: ' + score;
  overlay.style.display = 'block';
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':
      if (direction.y === 0) nextDirection = { x: 0, y: -1 };
      break;
    case 'ArrowDown':
      if (direction.y === 0) nextDirection = { x: 0, y: 1 };
      break;
    case 'ArrowLeft':
      if (direction.x === 0) nextDirection = { x: -1, y: 0 };
      break;
    case 'ArrowRight':
      if (direction.x === 0) nextDirection = { x: 1, y: 0 };
      break;
  }
});

restartBtn.addEventListener('click', init);

init();
</script>

</body>
</html>
